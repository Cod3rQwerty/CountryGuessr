<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryGuessr</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <nav>
        <h1 class="title">
            Country<span class="accent-text">Guessr</span>
        </h1>
        <img src="images/stats.svg" class="nav-icon" alt="Statistics">
    </nav>

    <div class="game-area">
        <div class="game-container">

            <div class="guess-panel">
                <div class="tracker-container">
                    <p class="tracker-text">Attempts: <span class="accent-text" id="current-attempts">0</span> / 5</p>
                </div>

                <div class="input-group">
                    <input class="country-input" list="countries" placeholder="Type a country...">
                    <button class="submit-btn">Guess</button>
                </div>

                <div class="guesses-stack">
                    <div class="guess">
                        Mozambique
                    </div>
                    <div class="guess">
                        Mozambique
                    </div>
                    <div class="guess">
                        Mozambique
                    </div>
                </div>

                <div class="alert-container">
                    <p class="alert">Your guess was not correct. You have 2 guesses left.</p>
                </div>

            </div>


            <div class="hints-stack">
                <div class="hint locked">
                    <span class="hint-tag">Hint 1</span>
                    <span class="hint-content">Locked</span>
                </div>

                <div class="hint locked">
                    <span class="hint-tag">Hint 2</span>
                    <span class="hint-content">Locked</span>
                </div>

                <div class="hint locked">
                    <span class="hint-tag">Hint 3</span>
                    <span class="hint-content">Locked</span>
                </div>

                <div class="hint locked">
                    <span class="hint-tag">Hint 4</span>
                    <span class="hint-content">Locked</span>
                </div>
            </div>

        </div>
    </div>

</body>

<datalist id="countries"></datalist>

</html>
