<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryGuessr</title>
    <link rel="stylesheet" href="style.css">

    <script src="iso3_countries.js"></script>
    <script src="script.js" defer></script>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <nav>
        <h1 class="title">
            Country<span class="accent-text">Guessr</span>
        </h1>
        <img src="images/stats.svg" class="nav-icon" alt="Statistics">
    </nav>

    <div class="game-area">
        <div class="game-container">

            <div class="guess-panel">
                <div class="tracker-container">
                    <p class="tracker-text">Attempts: <span class="accent-text" id="current-attempts">0</span> / 6</p>
                </div>

                <div class="input-group">
                    <input class="country-input" list="countries" placeholder="Type a country..." id="country-input">
                    <button class="submit-btn" id="submit-btn">Guess</button>
                </div>

                <div class="guesses-stack" id="guesses-stack">
                    <div class="guess-placeholder-container" id="guess-placeholder-container">
                        <p class="guess-placeholder"><i>Your guesses will show up here.</i></p>
                    </div>
                </div>

                <div class="alert-container">
                    <p class="alert" id="alert">Your guess was not correct. You have 2 guesses left.</p>
                </div>

            </div>

            <div class="hints-panel">
                <div class="hints-stack">
                    <div class="hint locked" id="hint-1">
                        <span class="hint-tag" id="hint-1-tag">Hint 1</span>
                        <span class="hint-content" id="hint-1-content">Locked</span>
                    </div>

                    <div class="hint locked" id="hint-2">
                        <span class="hint-tag" id="hint-2-tag">Hint 2</span>
                        <span class="hint-content" id="hint-2-content">Locked</span>
                    </div>

                    <div class="hint locked" id="hint-3">
                        <span class="hint-tag" id="hint-3-tag">Hint 3</span>
                        <span class="hint-content" id="hint-3-content">Locked</span>
                    </div>

                    <div class="hint locked" id="hint-4">
                        <span class="hint-tag" id="hint-4-tag">Hint 4</span>
                        <span class="hint-content" id="hint-4-content">Locked</span>
                    </div>

                    <div class="hint locked" id="hint-5">
                        <span class="hint-tag" id="hint-5-tag">Hint 5</span>
                        <span class="hint-content" id="hint-5-content">Locked</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <dialog class="win-dialog" id="winModal">
        <div class="win-dialog-contents">
            <h2 class="win-text">You Win!</h2>
            <p class="win-country-text">The country was
                <span class="country-accent-text" id="winCountryName">Canada!</span>
            </p>
            <img class="win-country-img" id="winCountryImg" src="https://flags.restcountries.com/v5/w640/ca.png">
            <button class="play-again-btn" id="playAgainBtn">Play Again</button>
        </div>
    </dialog>

</body>

<datalist id="countries"></datalist>

</html>
